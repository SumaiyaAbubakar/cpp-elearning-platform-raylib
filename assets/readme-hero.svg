<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">SAM — E-Learning Platform</title>
  <desc id="d">Animated banner for SAM, a role-based e-learning platform written in C++ with raylib, showing Student, Teacher and Admin panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14111f"/><stop offset="0.6" stop-color="#211b36"/><stop offset="1" stop-color="#28243c"/>
    </linearGradient>
    <linearGradient id="ttl" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="330" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffdc64"/><stop offset="0.5" stop-color="#ff6496"/><stop offset="1" stop-color="#8250c8"/>
      <animate attributeName="x1" values="56;236;56" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="330;510;330" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78d2b4" stop-opacity="0"/><stop offset="0.5" stop-color="#64c8ff"/><stop offset="1" stop-color="#ff6496" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a6ae0"/><stop offset="1" stop-color="#6a3fb0"/></linearGradient>
    <linearGradient id="ct" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe0c4"/><stop offset="1" stop-color="#3fa883"/></linearGradient>
    <linearGradient id="ca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd4ff"/><stop offset="1" stop-color="#2d8bd0"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#ff6496" stop-opacity="0.45"/><stop offset="1" stop-color="#ff6496" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#8250c8" stop-opacity="0.55"/><stop offset="1" stop-color="#8250c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#64c8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#64c8ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="frame"><rect width="1280" height="420" rx="22"/></clipPath>
    <clipPath id="typeclip"><rect x="64" y="318" width="0" height="30"><animate attributeName="width" values="0;330;330;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>

    <!-- drifting glows -->
    <circle r="260" fill="url(#g2)"><animate attributeName="cx" values="260;420;260" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/></circle>
    <circle r="230" fill="url(#g1)"><animate attributeName="cx" values="1060;900;1060" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="380;300;380" dur="16s" repeatCount="indefinite"/></circle>
    <circle r="200" fill="url(#g3)"><animate attributeName="cx" values="700;820;700" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="40;110;40" dur="12s" repeatCount="indefinite"/></circle>

    <!-- orbit rings behind the panels -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.09" transform="translate(930 210)">
      <circle r="150"/><circle r="205" stroke-dasharray="3 9"/>
    </g>
    <g transform="translate(930 210)">
      <g><circle cx="205" cy="0" r="5" fill="#ffdc64" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></g>
      <g><circle cx="-150" cy="0" r="4" fill="#78d2b4" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/></g>
    </g>

    <!-- top bar echo of the real app -->
    <rect width="1280" height="38" fill="#28243c"/>
    <text x="22" y="25" font-family="'Courier New',Consolas,monospace" font-size="15" font-weight="700" fill="#ffdc64" letter-spacing="1">SAM  |  E-Learning Platform</text>
    <g fill="#ffffff" fill-opacity="0.18"><circle cx="1224" cy="19" r="5"/><circle cx="1244" cy="19" r="5"/><circle cx="1264" cy="19" r="5"/></g>
    <rect y="38" width="1280" height="2" fill="url(#line)"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></rect>

    <!-- title block -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <text x="60" y="100" font-size="15" font-weight="600" letter-spacing="6" fill="#78d2b4">C++ · RAYLIB · OOP</text>
      <text x="56" y="222" font-size="132" font-weight="800" letter-spacing="-3" fill="url(#ttl)" filter="url(#glow)">SAM</text>
      <text x="64" y="268" font-size="30" font-weight="300" letter-spacing="9" fill="#f5f0ff">E-LEARNING PLATFORM</text>
      <text x="64" y="302" font-size="17" fill="#b8aedb">One desktop app. Three roles. Courses, grades, quizzes and class links in sync.</text>
    </g>

    <!-- typed code line -->
    <g clip-path="url(#typeclip)">
      <text x="64" y="340" font-family="'Courier New',Consolas,monospace" font-size="20" fill="#ff8fb4">class Student : public User</text>
    </g>
    <rect x="64" y="322" width="2" height="22" fill="#ffdc64"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="64;392;392;64" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/></rect>

    <!-- chips -->
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600">
      <g transform="translate(64 372)"><rect width="92" height="26" rx="13" fill="#8250c8" fill-opacity="0.25" stroke="#8250c8"/><text x="46" y="18" text-anchor="middle" fill="#d9c8ff">24 classes</text></g>
      <g transform="translate(166 372)"><rect width="106" height="26" rx="13" fill="#78d2b4" fill-opacity="0.2" stroke="#78d2b4"/><text x="53" y="18" text-anchor="middle" fill="#c8f3e4">23 screens</text></g>
      <g transform="translate(282 372)"><rect width="118" height="26" rx="13" fill="#64c8ff" fill-opacity="0.2" stroke="#64c8ff"/><text x="59" y="18" text-anchor="middle" fill="#cdeeff">CSV storage</text></g>
    </g>

    <!-- floating role panels (mirror the real student / teacher / admin cards) -->
    <g filter="url(#shadow)" font-family="'Segoe UI',Arial,sans-serif">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" repeatCount="indefinite"/>
        <g transform="translate(700 78) rotate(-4 100 90)">
          <rect width="210" height="190" rx="16" fill="url(#cs)"/>
          <text x="18" y="34" font-size="17" font-weight="700" fill="#fff">Student</text>
          <g fill="#fff" fill-opacity="0.22"><rect x="18" y="52" width="174" height="24" rx="8"/><rect x="18" y="86" width="174" height="24" rx="8"/><rect x="18" y="120" width="174" height="24" rx="8"/></g>
          <text x="30" y="69" font-size="12" fill="#fff">Courses · Quiz</text><text x="30" y="103" font-size="12" fill="#fff">Gradebook · Badge</text><text x="30" y="137" font-size="12" fill="#fff">Tasks · Zoom links</text>
          <rect x="18" y="158" width="90" height="10" rx="5" fill="#ffdc64"/>
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="7s" repeatCount="indefinite"/>
        <g transform="translate(900 150) rotate(2 100 90)">
          <rect width="210" height="190" rx="16" fill="url(#ct)"/>
          <text x="18" y="34" font-size="17" font-weight="700" fill="#14302a">Teacher</text>
          <g fill="#fff" fill-opacity="0.3"><rect x="18" y="52" width="174" height="24" rx="8"/><rect x="18" y="86" width="174" height="24" rx="8"/><rect x="18" y="120" width="174" height="24" rx="8"/></g>
          <text x="30" y="69" font-size="12" fill="#10332b">My courses</text><text x="30" y="103" font-size="12" fill="#10332b">Upload material · quiz</text><text x="30" y="137" font-size="12" fill="#10332b">Grade submissions</text>
          <rect x="18" y="158" width="64" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="8s" repeatCount="indefinite"/>
        <g transform="translate(1030 40) rotate(5 100 90)">
          <rect width="210" height="190" rx="16" fill="url(#ca)"/>
          <text x="18" y="34" font-size="17" font-weight="700" fill="#0b2a44">Admin</text>
          <g fill="#fff" fill-opacity="0.3"><rect x="18" y="52" width="174" height="24" rx="8"/><rect x="18" y="86" width="174" height="24" rx="8"/><rect x="18" y="120" width="174" height="24" rx="8"/></g>
          <text x="30" y="69" font-size="12" fill="#0b2a44">Approve courses</text><text x="30" y="103" font-size="12" fill="#0b2a44">Manage users</text><text x="30" y="137" font-size="12" fill="#0b2a44">Subscriptions</text>
          <rect x="18" y="158" width="110" height="10" rx="5" fill="#ff6496"/>
        </g>
      </g>
    </g>

    <!-- bottom accent -->
    <rect y="414" width="1280" height="6" fill="url(#line)"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
